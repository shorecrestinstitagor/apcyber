<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Site Walk</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: an ID-badge console. Sticky mission rail on top, one mission card at a time, briefing then game. */
:root {
  --bg: #F3F5F7; --panel: #FFFFFF; --ink: #17222E; --muted: #5B6875; --line: #D6DEE6;
  --navy: #14324A; --teal: #0F766E; --teal-soft: #DDF0EE; --rust: #B4532A; --rust-soft: #F6E3DA;
  --gold: #A9781E; --gold-soft: #F5ECDA; --slate: #3B5B8C; --slate-soft: #E1E8F3; --plum: #5B4B8A;
  --ts: #B4532A; --s: #A9781E; --c: #3B5B8C; --u: #0F766E;
  --display: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --body: "IBM Plex Sans", "Segoe UI", Arial, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0F1720; --panel: #17222E; --ink: #E7EDF3; --muted: #9AA8B6; --line: #2A3847;
  --navy: #9CC3E6; --teal: #4FC1B4; --teal-soft: #12332F; --rust: #E58A63; --rust-soft: #3A2118;
  --gold: #E0B45E; --gold-soft: #33280F; --slate: #8FAEDD; --slate-soft: #1C2A3F; --plum: #B3A4E6;
  --ts: #E58A63; --s: #E0B45E; --c: #8FAEDD; --u: #4FC1B4; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0F1720; --panel: #17222E; --ink: #E7EDF3; --muted: #9AA8B6; --line: #2A3847;
  --navy: #9CC3E6; --teal: #4FC1B4; --teal-soft: #12332F; --rust: #E58A63; --rust-soft: #3A2118;
  --gold: #E0B45E; --gold-soft: #33280F; --slate: #8FAEDD; --slate-soft: #1C2A3F; --plum: #B3A4E6;
  --ts: #E58A63; --s: #E0B45E; --c: #8FAEDD; --u: #4FC1B4; color-scheme: dark }

* { box-sizing: border-box }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.5; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--panel); }
.wrap { max-width: 960px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
h1, h2, h3 { font-family: var(--display); text-wrap: balance; margin: 0; line-height: 1.15; }
p { margin: 0 }
button { font: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--slate); outline-offset: 2px; }

/* top rail */
.rail { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--panel); border-bottom: 1px solid var(--line); }
.rail .wrap { display: flex; align-items: center; gap: 14px; padding-block: 10px; flex-wrap: wrap; }
.brand { font-family: var(--display); font-weight: 800; font-size: 18px; color: var(--navy); letter-spacing: .01em; display: flex; align-items: center; gap: 8px; }
.brand .chip { font-family: var(--mono); font-size: 11px; font-weight: 600; color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 1px 6px; letter-spacing: .06em; }
.badges { display: flex; gap: 6px; margin-left: auto; flex-wrap: wrap; }
.badge { width: 38px; height: 38px; border-radius: 50%; border: 2px solid var(--line); background: var(--bg); color: var(--muted); font-family: var(--mono); font-weight: 600; font-size: 13px; display: grid; place-items: center; }
.badge.on { border-color: var(--navy); color: var(--navy); }
.badge.done { background: var(--teal); border-color: var(--teal); color: var(--panel); }
.badge:disabled { cursor: not-allowed; opacity: .55 }

main { padding-block: 28px 64px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 24px; }
.stack { display: flex; flex-direction: column; gap: 18px; }
.eyebrow { font-family: var(--mono); font-size: 12px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.lede { font-size: 18px; color: var(--muted); max-width: 62ch; }
.btn { border: 0; border-radius: 10px; padding: 12px 18px; font-weight: 600; background: var(--navy); color: var(--panel); }
.btn.ghost { background: transparent; color: var(--navy); border: 1.5px solid var(--navy); }
.btn:disabled { opacity: .45; cursor: not-allowed }
.row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }

/* home */
.hero { display: grid; grid-template-columns: 1.3fr 1fr; gap: 24px; align-items: center; }
.hero h1 { font-size: clamp(34px, 6vw, 56px); color: var(--navy); font-weight: 800; }
.idcard { border-radius: 16px; background: var(--navy); color: var(--panel); padding: 20px; display: grid; gap: 10px; min-width: 0; }
:root[data-theme="dark"] .idcard { color: #0F1720 }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .idcard { color: #0F1720 } }
.idcard .lbl { font-family: var(--mono); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; opacity: .8 }
.idcard input { width: 100%; font: 600 18px var(--body); padding: 10px 12px; border-radius: 8px; border: 0; background: var(--panel); color: var(--ink); }
.idcard .lv { display: flex; gap: 4px; }
.idcard .lv span { flex: 1; height: 8px; border-radius: 3px; }
.mlist { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; }
.mitem { display: flex; gap: 12px; align-items: flex-start; padding: 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--panel); min-width: 0; }
.mitem .n { font-family: var(--mono); font-weight: 600; color: var(--panel); background: var(--slate); border-radius: 8px; width: 34px; height: 34px; display: grid; place-items: center; flex: none; }
.mitem.done .n { background: var(--teal) }
.mitem b { display: block; font-family: var(--display); }
.mitem small { color: var(--muted); font-size: 14px; }
.howto { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
.howto div { padding: 14px; border-radius: 12px; background: var(--slate-soft); font-size: 15px; }
.howto b { display: block; font-family: var(--display); color: var(--slate); }

/* briefing */
.brief { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }
.bcard { border-radius: 12px; padding: 16px; background: var(--bg); border: 1px solid var(--line); min-width: 0; }
.bcard h3 { font-size: 17px; margin-bottom: 6px; }
.bcard p { font-size: 15px; }
.bcard .ex { margin-top: 8px; font-size: 14px; color: var(--muted); font-style: italic; }
.quote { border-radius: 12px; padding: 18px 20px; background: var(--navy); color: var(--panel); font-family: var(--display); font-size: 20px; font-weight: 500; }
:root[data-theme="dark"] .quote { color: #0F1720 }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .quote { color: #0F1720 } }
.quote small { display: block; font-family: var(--mono); font-size: 12px; margin-top: 6px; opacity: .8 }
.tag { display: inline-block; font-family: var(--mono); font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: var(--slate-soft); color: var(--slate); }
details.review { border: 1px dashed var(--line); border-radius: 12px; padding: 10px 14px; }
details.review summary { cursor: pointer; font-weight: 600; color: var(--slate); }
details.review[open] summary { margin-bottom: 12px; }

/* ladder */
.ladder { display: grid; gap: 6px; }
.ladder div { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 8px 12px; border-radius: 8px; color: var(--panel); font-weight: 600; font-size: 15px; }
:root[data-theme="dark"] .ladder div { color: #0F1720 }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .ladder div { color: #0F1720 } }
.wurd { display: grid; grid-template-columns: 1.4fr 1fr 1fr; gap: 4px; font-size: 14px; }
.wurd span { padding: 6px 8px; border-radius: 6px; background: var(--bg); text-align: center; }
.wurd .h { font-weight: 700; background: transparent }
.wurd .y { background: var(--teal-soft); color: var(--teal); font-weight: 600 }
.wurd .n { background: var(--rust-soft); color: var(--rust); font-weight: 600 }
.wurd .me { background: var(--navy); color: var(--panel); font-weight: 700 }

/* game */
.gamehead { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.meter { font-family: var(--mono); font-size: 13px; color: var(--muted); }
.bar { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--teal); transition: width .3s; }
.dossier { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 8px; }
.dossier div { padding: 10px 12px; border-radius: 10px; background: var(--bg); border: 1px solid var(--line); min-width: 0; }
.dossier .k { font-family: var(--mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); display: block; }
.dossier .v { font-weight: 600; font-size: 15px; }
.dossier .rule { grid-column: 1 / -1; background: var(--gold-soft); border-color: transparent; }
.prompt { font-family: var(--display); font-size: 21px; font-weight: 700; }
.opts { display: grid; gap: 10px; }
.opts.cols { grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
.opt { text-align: left; padding: 14px 16px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--panel); color: var(--ink); font-size: 16px; transition: border-color .15s, background .15s; }
.opt:hover:not(:disabled) { border-color: var(--slate); }
.opt.right { border-color: var(--teal); background: var(--teal-soft); }
.opt.wrong { border-color: var(--rust); background: var(--rust-soft); }
.opt:disabled { cursor: default }
.opt.big { text-align: center; font-family: var(--display); font-weight: 700; font-size: 20px; padding: 18px; }
.fb { border-radius: 12px; padding: 14px 16px; font-size: 15px; }
.fb.ok { background: var(--teal-soft); }
.fb.no { background: var(--rust-soft); }
.fb b { font-family: var(--display); }
.shake { animation: shake .3s }
@keyframes shake { 25% { transform: translateX(-5px) } 75% { transform: translateX(5px) } }
.access { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; font-size: 18px; }
.lvpill { font-family: var(--mono); font-weight: 600; padding: 6px 12px; border-radius: 8px; color: var(--panel); font-size: 15px; }
:root[data-theme="dark"] .lvpill { color: #0F1720 }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .lvpill { color: #0F1720 } }
.verb { font-family: var(--display); font-weight: 800; font-size: 22px; }

/* chips game */
.sentence { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; min-height: 52px; padding: 12px; border-radius: 12px; background: var(--bg); border: 1px dashed var(--line); }
.chipb { padding: 10px 14px; border-radius: 999px; border: 1.5px solid var(--slate); background: var(--panel); color: var(--ink); font-weight: 600; }
.chipb.sel { background: var(--slate); color: var(--panel); }
.bins { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.bin { min-height: 96px; border-radius: 12px; border: 2px solid var(--line); background: var(--panel); padding: 10px; display: flex; flex-direction: column; gap: 6px; align-items: stretch; text-align: left; color: var(--ink); min-width: 0; }
.bin .t { font-family: var(--mono); font-size: 12px; font-weight: 600; letter-spacing: .08em; }
.bin .d { font-size: 13px; color: var(--muted); }
.bin.s { border-color: var(--slate) } .bin.s .t { color: var(--slate) }
.bin.o { border-color: var(--gold) } .bin.o .t { color: var(--gold) }
.bin.b { border-color: var(--teal) } .bin.b .t { color: var(--teal) }
.bin .placed { font-weight: 600; font-size: 15px; padding: 6px 10px; border-radius: 8px; background: var(--bg); }
.bin .placed.bad { background: var(--rust-soft); }

/* finish + report */
.code { font-family: var(--mono); font-weight: 600; font-size: 34px; letter-spacing: .18em; color: var(--teal); padding: 10px 18px; border: 2px dashed var(--teal); border-radius: 12px; display: inline-block; }
.score { font-family: var(--display); font-weight: 800; font-size: 44px; color: var(--navy); }
table.rep { width: 100%; border-collapse: collapse; font-size: 15px; }
table.rep th, table.rep td { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--line); }
table.rep td.mono { font-family: var(--mono); font-weight: 600; letter-spacing: .08em; }
.tbl { overflow-x: auto; }
.stamp { font-family: var(--mono); font-size: 13px; color: var(--muted); }

@media (max-width: 720px) {
  .hero { grid-template-columns: 1fr; }
  .bins { grid-template-columns: 1fr; }
  .bin { min-height: 64px }
  .card { padding: 18px }
  .prompt { font-size: 19px }
}
@media (prefers-reduced-motion: reduce) { .shake { animation: none } .bar i { transition: none } }
</style>
</head>
<body>

<header class="rail"><div class="wrap">
  <div class="brand"><a href="index.html" style="color:var(--slate);text-decoration:none;font-family:var(--body);font-weight:600;font-size:14px" aria-label="AP Cybersecurity home">&larr; Home</a> Site Walk <span class="chip">UNIT 2</span></div>
  <nav class="badges" id="badges" aria-label="Missions"></nav>
</div></header>
<main><div class="wrap" id="app"></div></main>

<script>
(function () {
const LV = { "Top Secret": "var(--ts)", "Secret": "var(--s)", "Confidential": "var(--c)", "Unclassified": "var(--u)" };
const RANK = { "Top Secret": 3, "Secret": 2, "Confidential": 1, "Unclassified": 0 };
const dec = (s) => atob(s);
const ALPH = "ACDEFHJKMNPRTUVWXY3479";
const norm = (n) => String(n).toLowerCase().replace(/[^a-z]/g, "");
function pcode(m, name) {
  let h = 2166136261; const str = norm(name) + "|" + m.id;
  for (const ch of str) { h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619) >>> 0; }
  return dec(m.code) + "-" + ALPH[h % ALPH.length] + ALPH[(h >>> 7) % ALPH.length];
}

/* ---------- mission content ---------- */
function spot(where, see) { return `<div class="dossier"><div><span class="k">Location</span><span class="v">${where}</span></div><div class="rule"><span class="k">What you notice</span><span class="v">${see}</span></div></div>`; }
function dos(f) { return `<div class="dossier">${f.map(([k, v, cls]) => `<div${cls ? ` class="${cls}"` : ""}><span class="k">${k}</span><span class="v">${v}</span></div>`).join("")}</div>`; }
const PLAN = `<svg viewBox="0 0 640 300" role="img" aria-label="Floor plan of Harbor Robotics" style="width:100%;max-width:640px;height:auto;display:block">
  <rect x="2" y="2" width="636" height="296" rx="10" fill="var(--bg)" stroke="var(--line)" stroke-width="2"/>
  <g font-family="IBM Plex Sans, Arial, sans-serif" font-size="14" font-weight="600">
  <rect x="20" y="20" width="180" height="120" rx="6" fill="var(--slate-soft)" stroke="var(--slate)"/><text x="110" y="75" text-anchor="middle" fill="var(--ink)">Reception</text><text x="110" y="95" text-anchor="middle" fill="var(--muted)" font-size="12" font-weight="400">visitor kiosk</text>
  <rect x="220" y="20" width="200" height="120" rx="6" fill="var(--teal-soft)" stroke="var(--teal)"/><text x="320" y="75" text-anchor="middle" fill="var(--ink)">Engineering desks</text><text x="320" y="95" text-anchor="middle" fill="var(--muted)" font-size="12" font-weight="400">laptops</text>
  <rect x="440" y="20" width="180" height="120" rx="6" fill="var(--rust-soft)" stroke="var(--rust)"/><text x="530" y="75" text-anchor="middle" fill="var(--ink)">Server room</text><text x="530" y="95" text-anchor="middle" fill="var(--muted)" font-size="12" font-weight="400">all company data</text>
  <rect x="220" y="160" width="200" height="120" rx="6" fill="var(--gold-soft)" stroke="var(--gold)"/><text x="320" y="215" text-anchor="middle" fill="var(--ink)">R&amp;D lab</text><text x="320" y="235" text-anchor="middle" fill="var(--muted)" font-size="12" font-weight="400">prototype robots</text>
  <rect x="440" y="160" width="180" height="120" rx="6" fill="var(--bg)" stroke="var(--muted)"/><text x="530" y="215" text-anchor="middle" fill="var(--ink)">Loading dock</text><text x="530" y="235" text-anchor="middle" fill="var(--muted)" font-size="12" font-weight="400">deliveries</text>
  <rect x="20" y="160" width="180" height="120" rx="6" fill="var(--bg)" stroke="var(--muted)" stroke-dasharray="5 4"/><text x="110" y="215" text-anchor="middle" fill="var(--ink)">Front entrance</text><text x="110" y="235" text-anchor="middle" fill="var(--muted)" font-size="12" font-weight="400">glass doors, parking lot</text>
  </g></svg>`;
const ATTACKS = ["Piggybacking", "Tailgating", "Shoulder surfing", "Dumpster diving", "Card cloning", "Physical port access"];
const RISK = ["High", "Moderate", "Low"];
const LOGOPT = ["Normal", "Door held open (tailgating or piggybacking)", "Possible cloned badge", "Unauthorized attempt", "Unusual time: investigate"];
const M = [
{ id: "sw1", short: "Inside", title: "Get Inside", minutes: 8, code: "RU5UUlk=",
  goal: "Explain why physical access matters, how card cloning works, and how layers of physical controls protect a building.",
  brief: `<p class="lede">You're the new security lead at <b>Harbor Robotics</b>. Before you walk the building, learn why a locked door is a cybersecurity control (CED 2.2-2.3).</p>
  <p style="color:var(--muted)"><b>You already know:</b> piggybacking (someone knowingly lets the attacker in), tailgating (the attacker slips in unnoticed), shoulder surfing, and dumpster diving.</p>
  <div class="brief">
    <div class="bcard"><h3>Physical access beats technical controls</h3><p>With hands on a device, an attacker can plug a keylogger or malicious USB drive into an open port, connect to a network jack, or walk out with a laptop or drive. A strong password and a firewall don't stop any of that (CED 2.2.C.1).</p></div>
    <div class="bcard"><h3>Card cloning</h3><p>A hidden reader copies the data on someone's access card, sometimes from a few inches away. The clone opens <b>every door and resource that person's card can reach</b>, so a badge that opens everything makes cloning worse. Least privilege applies to badges too.</p></div>
    <div class="bcard"><h3>Protect in layers</h3><p><b>Perimeter:</b> fences, gates, bollards (stop vehicles). <b>Entry:</b> card readers that log every badge, guards, access control vestibules and turnstiles (one person at a time). <b>Rooms:</b> locks on doors and cabinets. <b>Devices:</b> cable locks, disabled USB ports. <b>Power:</b> surge protectors, UPS, generators (CED 2.3.B).</p></div>
  </div>`,
  game: { type: "quiz", shuffle: true, items: [
    { q: "The lobby kiosk uses a 16-character password, MFA, and a firewall. A visitor plugs a small device between its keyboard and computer. Which statement BEST explains the risk?", o: ["MFA blocks the attack, since a stolen password alone can't log anyone in later", "The device records keystrokes in hardware, so the kiosk's technical controls never see it", "The firewall will flag the device, since all new hardware must connect through the network first", "The risk is low, because a 16-character password is too long to capture reliably"], a: 1, why: "A hardware keylogger sits between the keyboard and the computer, outside the kiosk's software. Physical access gets around technical controls (CED 2.2.C.1). MFA helps later logins, but the attacker also sees everything else typed." },
    { q: "An attacker cloned an engineer's badge. Her badge opens the lobby, R&D lab, server room, and loading dock, but her job only needs the lobby and R&D lab. Which change MOST limits the damage from the next cloned badge?", o: ["Reissue every employee a new badge number each month", "Limit each badge to only the doors that person's role actually needs", "Post a guard who checks every badge at the lobby", "Require employees to carry badges in RFID-blocking sleeves"], a: 1, why: "A clone opens everything the real card opens, so least privilege on badges limits the damage. Sleeves and reissuing make cloning harder (likelihood), but a clone that does happen still opens every door." },
    { q: "Harbor Robotics is replacing the key lock on the R&D lab with a card reader. Which benefit does the card reader add that a key lock CANNOT provide?", o: ["It keeps unauthorized people out of the lab", "It logs which badge opened the door and when", "It stops someone from following an employee inside the lab", "It prevents the door from being propped open"], a: 1, why: "Both keep people out. Only the card reader logs badge use (CED 2.3.B.4). Neither stops tailgating or a propped door; that takes vestibules, door sensors, or people." },
    { q: "A delivery truck could drive straight through Harbor Robotics' glass lobby doors. Which control addresses THIS risk?", o: ["Bollards in front of the entrance", "A turnstile inside the lobby", "A guard posted at the lobby doors", "Reinforced locks on the lobby doors"], a: 0, why: "Bollards stop vehicles from reaching doors and windows (CED 2.3.B.2). A turnstile, guard, or lock controls people, not a moving truck." },
    { q: "During the 8 a.m. rush, employees hold the badge door for coworkers, so several people enter on one swipe. Nobody is sneaking in on purpose. Which control BEST stops extra people from entering on one swipe?", o: ["Awareness training on not badging others in", "An access control vestibule or turnstile at the badge door", "A camera recording the badge door", "Door sensors that alert on long open times"], a: 1, why: "Vestibules and turnstiles prevent intentional or accidental admission of extra people (CED 2.3.B.5). Training helps but depends on people; cameras and door sensors only detect it afterward." },
    { q: "A man in a delivery uniform waits by the side door. When an engineer badges in, he says \"Thanks!\" and walks in right behind her. She sees him, assumes he works there, and doesn't stop him. Which attack is this?", o: ["Tailgating, because he followed her through the door", "Piggybacking, because she noticed him and let him in", "Tailgating, because she never actually invited him in", "Pretexting only, because no badge was used at all"], a: 1, why: "She saw him and allowed it because of the uniform and his confidence: social engineering got an authorized person to let him in, so it's piggybacking. Tailgating is when the employee doesn't notice." }
  ] } },

{ id: "sw2", short: "Walk", title: "Walk the Building", minutes: 12, code: "TEFZRVJT",
  goal: "Rate each physical risk and choose the best control.",
  brief: `<p class="lede">Walk Harbor Robotics room by room. At each stop, rate the risk using the CED's scale, then choose the best control.</p>
  ${PLAN}
  <div class="brief">
    <div class="bcard"><h3>High</h3><p>Direct access to the most important systems or data. CED example: an unlocked server room.</p></div>
    <div class="bcard"><h3>Moderate</h3><p>A real path to an attack, but limited. CED example: a receptionist's computer with exposed USB ports.</p></div>
    <div class="bcard"><h3>Low</h3><p>Limited impact. CED example: unattended laptops without cable locks.</p></div>
  </div>
  <p><b>Controls to choose from (CED 2.3.B):</b> fences, gates, bollards (stop vehicles) · locks on doors, cabinets, and computers · card readers that log badges · access control vestibules and turnstiles (one person at a time) · disabling USB ports · guards · surge protectors, UPS, generators.</p>`,
  game: { type: "quiz", shuffle: true, items: [] } },

{ id: "sw3", short: "Watch", title: "Place the Sensors", minutes: 10, code: "V0FUQ0g=",
  goal: "Choose and place detective controls for a physical space.",
  brief: `<p class="lede">Locks and fences <b>prevent</b>. Now add controls that <b>detect</b> a physical attack (CED 2.4).</p>
  <div class="brief">
    <div class="bcard"><h3>Cameras</h3><p>Recorded and monitored. Cover entry and exit points; mount them at a good angle where they're hard to tamper with. With facial recognition, they can alert on unauthorized people in controlled areas.</p></div>
    <div class="bcard"><h3>Motion sensors</h3><p>Best in areas where traffic is unexpected, like a lab at night. Verify a motion alert with a camera before responding.</p></div>
    <div class="bcard"><h3>Guards</h3><p>Stationary guards at funnel points (the main entrance); patrolling guards for the perimeter.</p></div>
    <div class="bcard"><h3>Badge doors</h3><p>Door sensors record how long a door stays open. Longer than normal can reveal tailgating or piggybacking.</p></div>
    <div class="bcard"><h3>People</h3><p>Employees who report unauthorized people are a detective control too.</p></div>
  </div>`,
  game: { type: "quiz", shuffle: true, items: [
    { q: "You can afford two new cameras for Harbor Robotics. Where should they point FIRST?", o: ["The front entrance and the loading dock", "The server room and the R&D lab", "The parking lot and the break room", "The CEO's office and the main server room"], a: 0, why: "Cameras should cover entry and exit points first, so you know who came in and left (CED 2.4.B.1). Interior rooms matter, but everyone passes through the entrances." },
    { q: "The R&D lab is empty from 7 p.m. to 7 a.m., and nobody watches the camera feeds overnight. Which control BEST detects someone inside the lab at night?", o: ["A motion sensor inside the lab", "A camera recording the lab door", "A badge reader logging entries", "A guard patrolling the perimeter"], a: 0, why: "Motion sensors fit areas where traffic is unexpected (CED 2.4.B.2) and alert right away. An unwatched camera only records; a badge log misses someone who got in another way." },
    { q: "A motion sensor in the warehouse fires at 2:14 a.m. What should the security team do FIRST?", o: ["Call the police right away", "Check the warehouse camera to verify", "Send the patrolling guard in immediately", "Log it and review it in the morning"], a: 1, why: "Verify motion alerts with cameras before responding (CED 2.4.C.2). It could be a cleaner, an animal, or an intruder, and the camera tells the guard what they're walking into." },
    { q: "Harbor Robotics has one stationary guard and one patrolling guard. Where should each one go?", o: ["Stationary at the main entrance; patrolling the perimeter", "Stationary on the perimeter fence; patrolling the main entrance", "Both at the main entrance during the morning rush", "Stationary at the server room; patrolling the lobby"], a: 0, why: "Stationary guards work best at funnel points everyone passes through; patrolling guards cover perimeters (CED 2.4.B.4)." },
    { q: "A stairwell camera is mounted at head height, where anyone can reach it. What's the problem?", o: ["It can be easily blocked or tampered with", "Its angle is too low to capture clear faces", "Stairwells don't need any camera coverage", "It should be a motion sensor instead"], a: 0, why: "Placement should consider coverage, angle, and tamper resistance (CED 2.4.B.1). Head height actually gives good faces, but it's easy to cover or knock away. Mount it higher." },
    { q: "During the workday, IT staff go in and out of the server room constantly. An intruder uses a cloned IT badge to get in. Which detective control could STILL alert on them?", o: ["The badge reader's log of server room entries", "A camera with facial recognition in the server room", "A door sensor that tracks how long the door stays open", "A motion sensor inside the server room"], a: 1, why: "The badge looked valid, the door opened normally, and motion is expected during the day. Facial recognition can alert on someone not authorized for that room (CED 2.4.C.1)." },
    { q: "People keep piggybacking into the lobby during the morning rush. Which control is DESIGNED to prevent this?", o: ["An access control vestibule at the lobby entrance", "A camera with facial recognition", "Door sensors on the lobby door", "A guard patrolling the perimeter"], a: 0, why: "Vestibules prevent piggybacking and tailgating by letting one person through at a time (CED 2.4.B.4, 2.3.B.5). Cameras and door sensors detect it after it happens." }
  ] } },

{ id: "sw4", short: "Logs", title: "Read the Badge Log", minutes: 10, code: "RE9PUkxPRw==",
  goal: "Use badge and door-sensor logs to spot physical attacks.",
  brief: `<p class="lede">Every badge door records <b>which badge</b>, <b>which door</b>, <b>when</b>, and <b>how long the door stayed open</b>. At Harbor Robotics, a normal entry keeps the door open about <b>3 to 5 seconds</b>.</p>
  <div class="brief">
    <div class="bcard"><h3>Door held open</h3><p>Open much longer than normal: someone may have followed the person in (tailgating) or been let in (piggybacking) (CED 2.4.C.3).</p></div>
    <div class="bcard"><h3>Possible cloned badge</h3><p>The same badge used in two places too far apart to travel between, or while the owner is somewhere else.</p></div>
    <div class="bcard"><h3>Unauthorized attempt</h3><p>Repeated DENIED entries at a door the badge isn't allowed to open.</p></div>
    <div class="bcard"><h3>Unusual time</h3><p>Access far outside a person's normal hours. Not proof of an attack, but worth investigating.</p></div>
  </div>`,
  game: { type: "quiz", items: [] } },

{ id: "sw5", short: "Budget", title: "Budget the Fix", minutes: 8, code: "QlVER0VU",
  goal: "Prioritize physical controls by severity and cost.",
  brief: `<p class="lede">You can't fix everything at once. The CED says to prioritize physical controls by <b>severity</b> (how bad is the risk?) and <b>cost</b> (how much does the fix cost?) (CED 2.3.B.8).</p>
  <div class="brief">
    <div class="bcard"><h3>Fix first</h3><p>High severity, low cost. A lock on the server room door.</p></div>
    <div class="bcard"><h3>Plan for</h3><p>High severity, high cost. A vestibule. Use cheaper controls (training, a guard) meanwhile.</p></div>
    <div class="bcard"><h3>When convenient</h3><p>Low severity, low cost. Cable locks.</p></div>
  </div>
  <p>Remember: <b>preventive</b> controls stop it, <b>detective</b> controls notice it, <b>corrective</b> controls clean up.</p>`,
  game: { type: "quiz", shuffle: true, items: [
    { q: "You have $500 left in this year's budget. Which do you fund FIRST?", o: ["Self-closing server room lock ($300)", "Cable locks for all laptops ($450)", "Bollards at the front entrance ($3,000)", "A lobby vestibule ($40,000)"], a: 0, why: "Prioritize by severity and cost (CED 2.3.B.8). The server room is the highest risk, and the fix is cheap. Cable locks fit the budget but address a low risk." },
    { q: "The lobby kiosk has open USB ports, and visitors still need to use the kiosk. What's the cheapest effective fix?", o: ["Disable the USB ports in the kiosk's settings", "Post a guard beside the kiosk all day", "Point a camera at the kiosk from the front desk", "Move the kiosk out of the lobby entirely"], a: 0, why: "Disabling USB ports costs almost nothing and removes the attack path while keeping the kiosk (CED 2.3.B.6). A camera only records it; a guard is expensive." },
    { q: "Tailgating at the lobby is a real problem, but the vestibule can't be installed until summer. What should you do NOW to reduce it?", o: ["Wait until the vestibule is installed", "Training plus a lobby guard during the rush", "A camera to identify tailgaters afterward", "Door sensors that log long open times at the lobby"], a: 1, why: "Use cheaper controls while the expensive one is planned: training (managerial · preventive) and a guard at the funnel point. Cameras and door sensors only detect it afterward." },
    { q: "Which control is labeled correctly?", o: ["Bollards: physical · detective", "Recorded camera at the loading dock: physical · detective", "Badge reader denying entry: technical · corrective", "Disabled USB ports: managerial · preventive"], a: 1, why: "A camera you can touch is physical, and it notices and records (detective). Bollards are preventive; a reader denying entry is preventive; disabled ports are technical." },
    { q: "Brief power outages (under a minute) crashed the main server twice this year in the middle of updates. Which control fits BEST?", o: ["A UPS on the main server", "A surge protector on the server", "Daily backups of the server's data", "A generator for the whole building"], a: 0, why: "A UPS keeps the server running through short outages (CED 2.3.B.7). A surge protector handles spikes, not outages; backups restore data but don't prevent the crash; a generator is for long outages." }
  ] } },

{ id: "sw6", short: "Final", title: "Final Inspection", minutes: 8, code: "U0VDVVJFRA==",
  goal: "Six AP-style questions. Your first-try score is your exit ticket.",
  brief: `<p class="lede">This is your exit ticket. Read every choice before clicking; you want the <b>BEST</b> answer. Your first click on each question counts.</p>`,
  game: { type: "quiz", items: [
    { q: "At Harbor Robotics, the R&D lab door normally stays open about 4 seconds per swipe. The log shows one 8:02 a.m. swipe with the door open 25 seconds. What is the MOST likely concern?", o: ["The badge was cloned and used by someone else today", "Someone may have followed the badge holder in", "The badge holder entered outside normal hours", "The badge reader failed to log the exit"], a: 1, why: "A longer-than-normal open time can reveal tailgating or piggybacking (CED 2.4.C.3). 8:02 a.m. is a normal time, and nothing suggests a clone." },
    { q: "A motion sensor in a closed warehouse alerts at 3 a.m. What is the BEST first step?", o: ["Send a guard to the warehouse right away", "Call the police and report a break-in", "Verify the alert by checking the warehouse camera first", "Turn off the sensor and check it in the morning"], a: 2, why: "Verify motion alerts with cameras before responding (CED 2.4.C.2)." },
    { q: "Using the CED's examples, how should a receptionist's computer with exposed USB ports in a public waiting area be rated?", o: ["Moderate, because it's a real but limited path", "High, because USB malware could spread to the server", "Low, because the receptionist can watch visitors", "High, because the computer sits in a public area"], a: 0, why: "The CED gives this exact example as moderate (CED 2.2.C.3). An unlocked server room is high; unattended laptops without cable locks are low." },
    { q: "Ms. Lee's badge opens the main entrance at 9:00 a.m. and the warehouse across town at 9:02 a.m. Both doors are on her access list. What's the BEST response?", o: ["Normal, since both doors are already on her access list", "An unauthorized attempt; review her access level", "Unusual time; ask her manager in the morning", "A possible cloned badge; disable it and investigate"], a: 3, why: "No one can be in both places two minutes apart, so a clone is likely even though both doors are allowed. Disabling it is corrective; the log review was detective." },
    { q: "Harbor Robotics can afford ONE guard. Its fence is solid, but people sometimes slip in through the main entrance behind employees. Where should the guard go?", o: ["Station the guard at the main entrance", "Patrol the fence line all day", "Patrol the parking lot and loading dock", "Station the guard outside the server room"], a: 0, why: "The problem is at the funnel point, and a stationary guard there can stop it (CED 2.4.B.4). Patrolling covers a perimeter that's already solid." },
    { q: "Why do security teams treat physical access to a server as such a serious risk?", o: ["Servers cost more to replace than other devices", "Hands-on access can get around passwords and firewalls", "Servers have no technical controls of their own", "Physical attacks happen more often than network attacks do"], a: 1, why: "Physical access bypasses technical controls (CED 2.2.C.1)." }
  ] } },
];

/* Mission 2: room-by-room walk (risk + control per stop) */
const WALK = [
  { where: "Server room", see: "The door has a lock, but it's propped open with a trash can \"for airflow.\" No camera.", risk: 0, rwhy: "Anyone walking by can reach the servers holding all company data. The CED's high-risk example is an unlocked server room.", o: ["A camera on the door to record who enters", "A self-closing lock and a cooling fix", "A sign and a staff reminder to keep it shut", "A motion sensor in the room after hours"], a: 1, why: "A sign changes nothing and a camera only records. A self-closing lock prevents entry (physical · preventive), and fixing the cooling removes the reason to prop it." },
  { where: "Reception", see: "The visitor kiosk computer sits in the waiting area with its USB ports facing visitors.", risk: 1, rwhy: "A visitor could plug in a keylogger or malicious drive. The CED rates this example moderate.", o: ["A camera aimed at the kiosk from behind the front desk", "Disable the USB ports and move the tower", "A sign telling visitors not to touch the kiosk", "A longer password on the kiosk account"], a: 1, why: "Removing the open ports removes the attack path (CED 2.3.B.6). A password doesn't stop a keylogger, and a camera only records." },
  { where: "Engineering desks", see: "Engineers leave laptops on their desks at lunch. No cable locks; screens lock after 30 minutes.", risk: 2, rwhy: "One device could be stolen or used briefly. The CED rates unattended laptops without cable locks as low.", o: ["A vestibule at the engineering entrance", "Cable locks and a 5-minute screen lock", "A guard patrolling the desks at lunch", "Motion sensors over the engineering desks"], a: 1, why: "Cheap controls for a low risk: cable locks (physical) and a shorter screen lock (technical). A vestibule or guard costs far more than this risk justifies." },
  { where: "Loading dock", see: "The badge door stays open while trucks unload. Drivers and strangers walk in behind staff.", risk: 1, rwhy: "Unknown people can tailgate in during deliveries, but they still have to get past interior locked doors.", o: ["A camera that records every delivery", "A guard at deliveries; keep the door shut", "A turnstile that all drivers must pass through", "Awareness training for every delivery company's drivers"], a: 1, why: "The dock is a funnel point during deliveries. A guard plus keeping the door shut stops tailgating; a camera only records, and you can't train another company's drivers." },
  { where: "Front entrance", see: "Glass doors open right onto the parking lot. A car could drive straight up to them.", risk: 2, rwhy: "A vehicle could damage the entrance, but it doesn't give direct access to data or systems.", o: ["Bollards in front of the glass doors", "A fence around the parking lot", "Shatter-resistant film on the glass", "A camera covering the parking lot"], a: 0, why: "Bollards stop vehicles from reaching doors and windows (CED 2.3.B.2). A car already in the lot gets past a fence, and film doesn't stop a vehicle." },
];
M[1].game.items = WALK.flatMap((w) => [
  { ctx: spot(w.where, w.see), q: "Rate the risk.", o: RISK, a: w.risk, why: w.rwhy, big: true, lbl: w.where + ": risk" },
  { ctx: spot(w.where, w.see), q: "Best control?", o: w.o, a: w.a, why: w.why, lbl: w.where + ": control" },
]);

/* Mission 4: badge log */
const LOG = [
  { f: [["Time", "7:58 a.m."], ["Badge", "R. Diaz (engineer)"], ["Door", "Main entrance"], ["Result", "GRANTED · open 4 s"]], a: 0, why: "Normal time, normal door, normal open time." },
  { f: [["Time", "8:02 a.m."], ["Badge", "J. Park (engineer)"], ["Door", "R&D lab"], ["Result", "GRANTED · open 19 s"]], a: 1, why: "19 seconds is far longer than the usual 3-5. Someone may have followed J. Park in, or been let in (CED 2.4.C.3)." },
  { f: [["Time", "12:15 p.m."], ["Badge", "T. Moss (sales)"], ["Door", "Server room"], ["Result", "DENIED · DENIED · DENIED"]], a: 3, why: "Three denied attempts at a door this badge isn't allowed to open." },
  { f: [["Time", "12:16 p.m. and 12:17 p.m."], ["Badge", "L. Chen (finance)"], ["Doors", "Main entrance, then the warehouse across town"], ["Result", "GRANTED · GRANTED"]], a: 2, why: "No one can travel across town in one minute. One of those badges is a copy." },
  { f: [["Time", "6:40 p.m."], ["Badge", "K. Ruiz (night cleaning crew)"], ["Door", "Break room"], ["Result", "GRANTED · open 5 s"], ["Note", "Cleaning crew works 6 p.m. to 10 p.m.", "rule"]], a: 0, why: "Inside her scheduled hours, normal open time." },
  { f: [["Time", "2:12 a.m."], ["Badge", "A. Shah (engineer, works 9 to 5)"], ["Door", "R&D lab"], ["Result", "GRANTED · open 4 s"]], a: 4, why: "Nothing technically wrong, but 2 a.m. is far outside her normal hours. Check the camera and ask; it could be a stolen badge." },
];
M[3].game.items = LOG.map((l, i) => ({ ctx: `<div class="eyebrow">Log entry ${i + 1} of ${LOG.length}</div>` + dos(l.f), q: "What does this entry show?", o: LOGOPT, a: l.a, why: l.why, lbl: "Log entry " + (i + 1) }));
M[5].game.items.forEach((it, j) => { it.lbl = "Question " + (j + 1); });
M[2].game.items.forEach((it, j) => { it.lbl = "Sensor question " + (j + 1); });
M[4].game.items.forEach((it, j) => { it.lbl = "Budget question " + (j + 1); });

/* ---------- state ---------- */
const KEY = "site-walk-v1";
let S = { name: "", done: {}, view: "home" };
try { const v = JSON.parse(localStorage.getItem(KEY) || "null"); if (v && typeof v === "object") S = Object.assign(S, v); } catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };
const unlocked = (i) => i === 0 || !!S.done[M[i - 1].id];
const app = document.getElementById("app");
const esc = (t) => String(t).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function badges() {
  const nav = document.getElementById("badges");
  nav.innerHTML = "";
  M.forEach((m, i) => {
    const b = document.createElement("button");
    b.className = "badge" + (S.done[m.id] ? " done" : "") + (S.view === m.id ? " on" : "");
    b.textContent = i + 1; b.title = "Mission " + (i + 1) + ": " + m.title; b.setAttribute("aria-label", b.title);
    b.disabled = !unlocked(i);
    b.onclick = () => go(m.id);
    nav.appendChild(b);
  });
  const r = document.createElement("button");
  r.className = "badge" + (S.view === "report" ? " on" : ""); r.textContent = "★"; r.title = "Mission report"; r.setAttribute("aria-label", "Mission report");
  r.onclick = () => go("report"); nav.appendChild(r);
}
function go(v) { S.view = v; save(); render(); window.scrollTo(0, 0); }
function render() { badges(); if (S.view === "home") home(); else if (S.view === "report") report(); else mission(M.findIndex((m) => m.id === S.view)); }

/* ---------- home ---------- */
function home() {
  const next = M.findIndex((m) => !S.done[m.id]);
  app.innerHTML = `<div class="stack">
    <section class="hero">
      <div class="stack" style="gap:12px">
        <div class="eyebrow">Unit 2 · Securing Spaces</div>
        <h1>Site Walk</h1>
        <p class="lede">You're the new security lead at Harbor Robotics. Six missions: spot attacks, walk the building, place sensors, read the badge log, budget the fixes, and pass the final inspection. Each mission earns a personal code word for your answer sheet.</p>
      </div>
      <div class="idcard">
        <span class="lbl">Security lead name (first and last)</span>
        <input id="nm" autocomplete="off" value="${esc(S.name)}" placeholder="Type your name" ${Object.keys(S.done).length ? "disabled" : ""}>${Object.keys(S.done).length ? `<span class="lbl">Name is locked once you finish a mission</span>` : ""}
        <div class="lv"><span style="background:var(--u)"></span><span style="background:var(--c)"></span><span style="background:var(--s)"></span><span style="background:var(--ts)"></span></div>
        <button class="btn" id="start" style="background:var(--panel);color:var(--navy)">${next === -1 ? "View mission report" : next === 0 ? "Start Mission 1" : "Continue: Mission " + (next + 1)}</button>
      </div>
    </section>
    <div class="howto">
      <div><b>Read the briefing</b>It's short and it has everything you need. You can reopen it during the game.</div>
      <div><b>Play the game</b>Wrong answers explain why. Your first try on each question is what gets scored.</div>
      <div><b>Collect code words</b>Write each code word and answer the short questions on your answer sheet.</div>
      <div><b>Screenshot your report</b>The ★ report at the end shows your scores. Submit it with your answer sheet.</div>
    </div>
    <div class="mlist">${M.map((m, i) => `<div class="mitem${S.done[m.id] ? " done" : ""}"><span class="n">${i + 1}</span><div><b>${m.title}</b><small>${m.goal} · about ${m.minutes} min</small></div></div>`).join("")}</div>
  </div>`;
  const nm = document.getElementById("nm");
  nm.oninput = () => { S.name = nm.value.slice(0, 60); save(); };
  document.getElementById("start").onclick = () => {
    if (!S.name.trim()) { nm.focus(); nm.placeholder = "Type your name first"; nm.classList.add("shake"); setTimeout(() => nm.classList.remove("shake"), 400); return; }
    go(next === -1 ? "report" : M[next].id);
  };
}

/* ---------- mission ---------- */
function mission(i) {
  const m = M[i];
  if (!unlocked(i)) return go("home");
  const done = S.done[m.id];
  app.innerHTML = `<div class="stack">
    <div class="card stack">
      <div class="eyebrow">Mission ${i + 1} of ${M.length} · about ${m.minutes} min</div>
      <h2 style="font-size:clamp(28px,4.5vw,40px);color:var(--navy)">${m.title}</h2>
      <p class="lede">${m.goal}</p>
      <div class="stack" id="brief">${m.brief}</div>
      <div class="row"><button class="btn" id="play">${done ? "Replay the game" : "I've read it. Start the game"}</button>${done ? `<button class="btn ghost" id="skip">See my code word</button>` : ""}</div>
    </div>
    <div id="game"></div>
  </div>`;
  document.getElementById("play").onclick = () => startGame(i);
  if (done) document.getElementById("skip").onclick = () => finish(i, null);
}
function shell(i, inner) {
  const m = M[i];
  const g = document.getElementById("game");
  g.innerHTML = `<div class="card stack">
    <details class="review"><summary>Reopen the briefing</summary><div class="stack">${m.brief}</div></details>
    ${inner}</div>`;
  return g;
}
function startGame(i) {
  document.getElementById("brief").parentElement.style.display = "none";
  const m = M[i];
  const res = { first: 0, total: 0, miss: [], t0: Date.now() };
  if (m.game.shuffleItems) res.items = m.game.items.slice().sort(() => Math.random() - 0.5);
  if (m.game.type === "chips") chips(i, res); else quiz(i, res, 0);
}
function head(i, k, n, res) {
  return `<div class="gamehead"><h3>${M[i].title}</h3><span class="meter">${k + 1} / ${n} · first-try ${res.first}/${res.total}</span></div><div class="bar"><i style="width:${(k / n) * 100}%"></i></div>`;
}

function quiz(i, res, k) {
  const m = M[i], items = res.items || m.game.items;
  if (k >= items.length) return finish(i, res);
  let it = items[k];
  if (m.game.shuffle && ![RISK, ATTACKS, LOGOPT].includes(it.o)) { const ord = it.o.map((_, j) => j).sort(() => Math.random() - 0.5); it = Object.assign({}, it, { o: ord.map((j) => it.o[j]), a: ord.indexOf(it.a) }); }
  const big = it.big || m.game.big;
  const g = shell(i, `${head(i, k, items.length, res)}
    ${it.ctx ? `<div>${it.ctx}</div>` : ""}
    <div class="prompt">${it.q}</div>
    <div class="opts${big || m.game.cols ? " cols" : ""}" id="opts">${it.o.map((o, j) => `<button class="opt${big ? " big" : ""}" data-j="${j}">${o}</button>`).join("")}</div>
    <div id="fb" aria-live="polite"></div>`);
  let tried = false;
  g.querySelectorAll(".opt").forEach((b) => b.onclick = () => {
    const j = +b.dataset.j, fb = document.getElementById("fb");
    if (!tried) { tried = true; res.total++; if (j === it.a) res.first++; else res.miss.push(it.lbl || it.q); }
    if (j === it.a) {
      b.classList.add("right");
      g.querySelectorAll(".opt").forEach((x) => x.disabled = true);
      fb.innerHTML = `<div class="fb ok stack" style="gap:10px"><p><b>Correct.</b> ${it.why}</p><div><button class="btn" id="nx">${k + 1 < items.length ? "Next" : "Finish mission"}</button></div></div>`;
      document.getElementById("nx").onclick = () => quiz(i, res, k + 1);
      document.getElementById("nx").focus();
    } else {
      b.classList.add("wrong", "shake"); b.disabled = true;
      fb.innerHTML = `<div class="fb no"><b>Not that one.</b> Try again. Hint: ${hintFor(it)}</div>`;
    }
  });
}
function hintFor(it) {
  if (it.o === RISK) return "how close does this get an attacker to the most important systems or data?";
  if (it.o === ATTACKS) return "did someone knowingly help, or not notice, or was nothing entered at all?";
  if (it.o === LOGOPT) return "compare the open time to 3-5 seconds, and check the time, place, and result.";
  return "reread the briefing card for this idea.";
}

function chips(i, res) {
  const items = M[i].game.items;
  let k = 0;
  const NAMES = ["SUBJECT", "OPERATION", "OBJECT"];
  const step = () => {
    if (k >= items.length) return finish(i, res);
    const parts = items[k];
    const order = [0, 1, 2].sort(() => Math.random() - 0.5);
    const placed = [null, null, null]; // bin -> part index
    let sel = null, tried = false;
    const draw = (bad) => {
      const g = shell(i, `${head(i, k, items.length, res)}
        <p>Tap a piece of the request, then tap the bin it belongs in. Fill all three bins, then check.</p>
        <div class="sentence" id="sent">${order.filter((p) => !placed.includes(p)).map((p) => `<button class="chipb${sel === p ? " sel" : ""}" data-p="${p}">${parts[p]}</button>`).join("") || `<span class="meter">All pieces placed.</span>`}</div>
        <div class="bins">${NAMES.map((n, b) => `<button class="bin ${["s", "o", "b"][b]}" data-b="${b}"><span class="t">${n}</span><span class="d">${["who or what is asking", "access · modify · add · remove", "the file or application"][b]}</span>${placed[b] !== null ? `<span class="placed${bad && bad[b] ? " bad" : ""}">${parts[placed[b]]}</span>` : ""}</button>`).join("")}</div>
        <div class="row"><button class="btn" id="chk" ${placed.includes(null) ? "disabled" : ""}>Check</button><button class="btn ghost" id="clr">Clear</button></div>
        <div id="fb" aria-live="polite"></div>`);
      g.querySelectorAll(".chipb").forEach((c) => c.onclick = () => { sel = +c.dataset.p; draw(); });
      g.querySelectorAll(".bin").forEach((bn) => bn.onclick = () => {
        const b = +bn.dataset.b;
        if (sel !== null) { if (placed[b] !== null) { /* swap back */ } placed[b] = sel; sel = null; draw(); }
        else if (placed[b] !== null) { placed[b] = null; draw(); }
      });
      document.getElementById("clr").onclick = () => { placed.fill(null); sel = null; draw(); };
      document.getElementById("chk").onclick = () => {
        const wrong = placed.map((p, b) => p !== b);
        if (!tried) { tried = true; res.total++; if (!wrong.some(Boolean)) res.first++; else res.miss.push("Request " + (k + 1) + ": " + parts.join(" ")); }
        if (!wrong.some(Boolean)) {
          draw();
          const fb = document.getElementById("fb");
          g.querySelectorAll("button.bin, .chipb, #chk, #clr").forEach((x) => x.disabled = true);
          fb.innerHTML = `<div class="fb ok stack" style="gap:10px"><p><b>Correct.</b> Subject: <b>${parts[0]}</b> · Operation: <b>${parts[1]}</b> · Object: <b>${parts[2]}</b></p><div><button class="btn" id="nx">${k + 1 < items.length ? "Next request" : "Finish mission"}</button></div></div>`;
          document.getElementById("nx").onclick = () => { k++; step(); };
          document.getElementById("nx").focus();
        } else {
          wrong.forEach((w, b) => { if (w) placed[b] = null; });
          draw(wrong);
          document.getElementById("fb").innerHTML = `<div class="fb no"><b>Some pieces bounced back.</b> Remember: the subject can be an app, and the object is the thing being acted on.</div>`;
        }
      };
    };
    draw();
  };
  step();
}

function finish(i, res) {
  const m = M[i];
  const prev = S.done[m.id];
  if (res && !prev) { S.done[m.id] = { first: res.first, total: res.total, miss: res.miss, mins: Math.max(1, Math.round((Date.now() - res.t0) / 60000)), at: new Date().toISOString() }; save(); }
  const rec = S.done[m.id];
  badges();
  const nextI = i + 1 < M.length ? i + 1 : null;
  const g = document.getElementById("game");
  document.getElementById("brief").parentElement.style.display = "none";
  g.innerHTML = `<div class="card stack" style="text-align:center;align-items:center">
    <div class="eyebrow">Mission ${i + 1} complete</div>
    <h2 style="font-size:32px;color:var(--navy)">${m.title}</h2>
    <div class="score">${rec.first}/${rec.total}</div>
    <p class="meter">correct on the first try${res && prev ? " (your first run is the one that's recorded)" : ""}</p>
    <p>Your personal code word:</p>
    <div class="code">${pcode(m, S.name)}</div>
    <p class="lede" style="text-align:center">This code only works for <b>${esc(S.name)}</b>. Someone else's code won't match your name. Write it on your answer sheet now, and answer the Mission ${i + 1} question there.</p>
    <div class="row" style="justify-content:center">${nextI !== null ? `<button class="btn" id="nx">Go to Mission ${nextI + 1}: ${M[nextI].title}</button>` : `<button class="btn" id="nx">See my mission report</button>`}</div>
  </div>`;
  document.getElementById("nx").onclick = () => go(nextI !== null ? M[nextI].id : "report");
}

/* ---------- report ---------- */
function report() {
  const tot = M.reduce((a, m) => a + (S.done[m.id] ? S.done[m.id].first : 0), 0);
  const all = M.reduce((a, m) => a + (S.done[m.id] ? S.done[m.id].total : 0), 0);
  const fin = M.every((m) => S.done[m.id]);
  const audit = S.done.m6;
  app.innerHTML = `<div class="card stack">
    <div class="eyebrow">Mission report</div>
    <h2 style="font-size:clamp(28px,4.5vw,40px);color:var(--navy)">${esc(S.name || "Unnamed security lead")}</h2>
    <p class="lede">${fin ? "All six missions complete. Take a screenshot of this page and submit it with your answer sheet." : "Finish every mission to complete your report. Unfinished missions show a dash."}</p>
    <div class="tbl"><table class="rep"><thead><tr><th>Mission</th><th>First-try score</th><th>Minutes</th><th>Personal code</th></tr></thead><tbody>
    ${M.map((m, i) => { const d = S.done[m.id]; return `<tr><td>${i + 1}. ${m.title}</td><td>${d ? d.first + "/" + d.total : "–"}</td><td>${d && d.mins ? d.mins : "–"}</td><td class="mono">${d ? pcode(m, S.name) : "–"}</td></tr>`; }).join("")}
    </tbody></table></div>
    <div class="stack" style="gap:8px"><h3>Missed on the first try</h3>
    ${M.map((m, i) => { const d = S.done[m.id]; if (!d) return ""; const ms = d.miss || []; return `<p style="font-size:14px"><b>${i + 1}. ${m.title}:</b> ${ms.length ? ms.map(esc).join(" · ") : "none"}</p>`; }).join("")}</div>
    <div class="row"><div><div class="eyebrow">Total first-try</div><div class="score">${tot}/${all || 0}</div></div><div style="margin-left:24px"><div class="eyebrow">Exit ticket (Final Audit)</div><div class="score">${audit ? audit.first + "/" + audit.total : "–"}</div></div></div>
    <p class="stamp">Report generated ${new Date().toLocaleString()}</p>
    <div class="row"><button class="btn ghost" id="hm">Back to start</button></div>
  </div>`;
  document.getElementById("hm").onclick = () => go("home");
}

/* ---------- teacher check (open the link with #teacher at the end) ---------- */
function teacher() {
  document.getElementById("badges").innerHTML = "";
  app.innerHTML = `<div class="card stack">
    <div class="eyebrow">Teacher check</div><h2 style="font-size:32px;color:var(--navy)">Verify personal code words</h2>
    <div class="row"><input id="pin" type="password" inputmode="numeric" placeholder="PIN" style="font:600 18px var(--body);padding:10px 12px;border-radius:8px;border:1.5px solid var(--line);background:var(--panel);color:var(--ink);width:140px"><button class="btn" id="unlock">Unlock</button></div>
    <div id="tpanel"></div></div>`;
  document.getElementById("unlock").onclick = () => {
    if (document.getElementById("pin").value !== dec("NDcyMQ==")) { document.getElementById("tpanel").innerHTML = `<p class="fb no">That PIN doesn't match.</p>`; return; }
    document.getElementById("tpanel").innerHTML = `<div class="stack"><p>Type each student's name exactly as they typed it (capitals, spaces, and punctuation don't matter), one per line.</p>
      <textarea id="names" rows="5" style="font:16px var(--body);padding:10px;border-radius:8px;border:1.5px solid var(--line);background:var(--panel);color:var(--ink);width:100%"></textarea>
      <div><button class="btn" id="show">Show codes</button></div><div id="codes" class="tbl"></div></div>`;
    document.getElementById("show").onclick = () => {
      const names = document.getElementById("names").value.split("\n").map((x) => x.trim()).filter(Boolean);
      document.getElementById("codes").innerHTML = `<table class="rep"><thead><tr><th>Name</th>${M.map((m, i) => `<th>M${i + 1}</th>`).join("")}</tr></thead><tbody>${names.map((n) => `<tr><td>${esc(n)}</td>${M.map((m) => `<td class="mono">${pcode(m, n)}</td>`).join("")}</tr>`).join("")}</tbody></table>`;
    };
  };
}
if (location.hash === "#teacher") teacher(); else render();
window.addEventListener("hashchange", () => { if (location.hash === "#teacher") teacher(); });
})();
</script>
